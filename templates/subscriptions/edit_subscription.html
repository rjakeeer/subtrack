{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Редактировать подписку — SubTrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-dark text-white fw-bold py-3">
                ✏️ Редактирование подписки: {{ subscription }}
            </div>
            <div class="card-body p-4">
                <form method="post" class="form">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success fw-bold">Сохранить изменения</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
